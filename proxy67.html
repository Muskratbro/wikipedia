<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>AllOrigins demo</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial;}
    #output{white-space:pre-wrap;border:1px solid #ddd;padding:12px;margin-top:12px;max-height:60vh;overflow:auto;}
  </style>
</head>
<body>
  <h3>Fetch via AllOrigins</h3>
  <input id="url" value="https://wikipedia.org" style="width:60%"/>
  <button id="go">Fetch</button>
  <div id="status"></div>
  <div id="output"></div>

  <script>
    async function fetchViaAllOrigins(targetUrl){
      const encoded = encodeURIComponent(targetUrl);
      // Use /raw if you want raw HTML string (some endpoints support it)
      const api = `https://api.allorigins.win/get?url=${encoded}`;
      const statusEl = document.getElementById('status');
      const out = document.getElementById('output');
      statusEl.textContent = 'Fetching...';

      try {
        const r = await fetch(api);
        if (!r.ok) throw new Error('Network response was not ok: ' + r.status);

        const json = await r.json();
        // allorigins returns { contents: "...", status: { ... } }
        // We'll insert into a container as text to avoid executing remote HTML scripts.
        out.textContent = json.contents;
        statusEl.textContent = 'Done — showing raw contents (text).';
      } catch (err) {
        statusEl.textContent = 'Error: ' + err.message;
        out.textContent = '';
        console.error(err);
      }
    }

    document.getElementById('go').addEventListener('click', () => {
      fetchViaAllOrigins(document.getElementById('url').value);
    });

    // auto-run once
    // fetchViaAllOrigins(document.getElementById('url').value);
  </script>
</body>
</html>
